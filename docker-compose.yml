services:
  fan-reubah:
    build:
      context: .
      dockerfile: Dockerfile
    image: mobufan/fan-reubah:latest
    container_name: fan-reubah
    ports:
      - 8081:8081
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 如部署环境需走代理，可在此按需配置（勿提交内网地址）：
    # environment:
    #   - HTTP_PROXY=http://<proxy-host>:<port>
    #   - HTTPS_PROXY=http://<proxy-host>:<port>
    #   - NO_PROXY=127.0.0.1,localhost
    restart: unless-stopped