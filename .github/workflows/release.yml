name: Release Pipeline

# 执行 scripts/build-and-push.sh <版本号>（自动调用 gh workflow run）时触发：
#   1) 编译自包含单文件二进制并创建 GitHub Release
#      （fan-reubah_linux_amd64 / fan-reubah_linux_arm64，内嵌前端资源与 vtracer 引擎）
#   2) 构建并推送 multi-arch Docker 镜像（Docker Hub + GHCR）
#   3) 同步 Git 仓库与标签到 CNB 镜像仓库
# 一次发版只产生一条 workflow run（jobs 链式：build-binaries -> publish-release -> build-docker -> sync-cnb）。
# 注意：日常 push / 打 tag 不会触发本工作流。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签 (例如: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name || github.event.inputs.tag }}
  DOCKERHUB_IMAGE: mobufan/fan-reubah
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-binaries:
    name: 编译二进制 (linux amd64 + arm64 + 内嵌资源)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Validate tag format
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "${{ github.event.inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "错误: 标签格式无效，必须以 'v' 开头，例如: v1.0.0"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/package-lock.json

      - name: Enable arm64 architecture and configure apt sources
        run: |
          sudo dpkg --add-architecture arm64
          # 重建 apt 源：amd64 用官方 archive.ubuntu.com，arm64 用 ports.ubuntu.com
          # （GitHub runner 预置镜像源无 arm64 索引，会导致 apt-get update 404 失败）。
          sudo cp .github/apt/fan-reubah.sources /etc/apt/sources.list.d/fan-reubah.sources
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

      - name: Install build dependencies (native + arm64 cross)
        run: |
          sudo apt-get install -y \
            gcc g++ pkg-config \
            libwebp-dev libheif-dev libde265-dev libx265-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libwebp-dev:arm64 libheif-dev:arm64 libde265-dev:arm64 libx265-dev:arm64

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add arm64 Rust target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Build vtracer (amd64)
        run: cd vtracer && cargo build --release -p vtracer-cli

      - name: Build vtracer (arm64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cd vtracer && cargo build --release --target aarch64-unknown-linux-gnu -p vtracer-cli

      - name: Build frontend assets
        run: |
          cd templates
          npm ci --no-audit --no-fund
          CI=true npm run build

      - name: Prepare embedded assets (frontend)
        run: |
          mkdir -p internal/assets/web
          rm -rf internal/assets/web/templates internal/assets/web/static
          tar --exclude='templates/node_modules' -cf - templates | tar -xf - -C internal/assets/web
          cp -rf static internal/assets/web/static

      - name: Prepare embedded assets (vtracer)
        run: |
          mkdir -p internal/assets/engine
          cp vtracer/target/release/vtracer internal/assets/engine/vtracer_linux_amd64
          cp vtracer/target/aarch64-unknown-linux-gnu/release/vtracer internal/assets/engine/vtracer_linux_arm64
          chmod +x internal/assets/engine/vtracer_linux_*

      - name: Build Go binary (amd64)
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p bin
          go build -buildvcs=false -ldflags="-s -w -X main.buildVersion=${RELEASE_TAG#v}" -o bin/fan-reubah_linux_amd64 ./cmd/server

      - name: Build Go binary (arm64 cross)
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: arm64
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: '1'
        run: go build -buildvcs=false -ldflags="-s -w -X main.buildVersion=${RELEASE_TAG#v}" -o bin/fan-reubah_linux_arm64 ./cmd/server

      - name: Verify build outputs
        id: build
        run: |
          set -e
          ls -lh bin/fan-reubah_linux_amd64 bin/fan-reubah_linux_arm64
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload binaries as artifacts
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: fan-reubah-binaries
          path: |
            bin/fan-reubah_linux_amd64
            bin/fan-reubah_linux_arm64
          if-no-files-found: error

  publish-release:
    name: 发布 Release (附带二进制)
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Download binaries
        if: needs.build-binaries.outputs.built == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fan-reubah-binaries
          path: ./

      - name: Prepare release body
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md _release_body.md
          else
            {
              echo "Fan-Reubah ${{ env.RELEASE_TAG }}"
              echo ""
              echo "自包含单文件二进制，已内嵌前端资源与 vtracer SVG 矢量引擎。"
              echo ""
              echo "Docker 镜像："
              echo "  - Docker Hub：docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ env.RELEASE_TAG }}"
              echo "  - GHCR：docker pull ${{ env.GHCR_IMAGE }}:${{ env.RELEASE_TAG }}"
            } > _release_body.md
          fi

      - name: Create / update Release with binaries
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          FILES=""
          [ -f bin/fan-reubah_linux_amd64 ] && FILES="$FILES bin/fan-reubah_linux_amd64"
          [ -f bin/fan-reubah_linux_arm64 ] && FILES="$FILES bin/fan-reubah_linux_arm64"
          gh release create "$TAG" \
            --title "Fan-Reubah $TAG" \
            --notes-file _release_body.md \
            $FILES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: 构建推送 Docker 镜像 (Docker Hub + GHCR)
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VER="${{ env.RELEASE_TAG }}"
          VER_NO_V="${VER#v}"
          TAGS="${{ env.DOCKERHUB_IMAGE }}:${VER},${{ env.DOCKERHUB_IMAGE }}:latest"
          TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${VER},${{ env.GHCR_IMAGE }}:${VER_NO_V}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-cnb:
    name: 同步到 CNB 镜像仓库
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Sync to CNB Repository
        if: ${{ env.CNB_TOKEN != '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -e PLUGIN_TARGET_URL="https://cnb.cool/meimolihan/fan-reubah.git" \
            -e PLUGIN_AUTH_TYPE="https" \
            -e PLUGIN_USERNAME="cnb" \
            -e PLUGIN_PASSWORD="$CNB_TOKEN" \
            -e PLUGIN_FORCE="true" \
            -e PLUGIN_PUSH_TAGS="true" \
            tencentcom/git-sync

      - name: Skip CNB sync
        if: ${{ env.CNB_TOKEN == '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: echo "::warning::CNB_ACCESS_TOKEN 未配置，跳过同步到 CNB 镜像仓库"