name: Release

# 推送 v 开头 tag（如 v1.0.0）时自动编译并创建 GitHub Release：
#   fan-reubah_linux_amd64 / fan-reubah_linux_arm64
# 每个二进制均为"自包含单文件"：已内嵌前端资源（templates/static）与 vtracer
# SVG 矢量引擎，无需再单独安装引擎或前端资产包。
# 安装脚本 install.sh 会按架构自动下载对应二进制。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/package-lock.json

      - name: Enable arm64 architecture and configure apt sources
        run: |
          sudo dpkg --add-architecture arm64
          # 重建 apt 源：amd64 用官方 archive.ubuntu.com，arm64 用 ports.ubuntu.com
          # （GitHub runner 预置镜像源无 arm64 索引，会导致 apt-get update 404 失败）。
          sudo cp .github/apt/fan-reubah.sources /etc/apt/sources.list.d/fan-reubah.sources
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

      - name: Install build dependencies (native + arm64 cross)
        run: |
          sudo apt-get install -y \
            gcc g++ pkg-config \
            libwebp-dev libheif-dev libde265-dev libx265-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libwebp-dev:arm64 libheif-dev:arm64 libde265-dev:arm64 libx265-dev:arm64

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add arm64 Rust target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Build vtracer (amd64)
        run: cd vtracer && cargo build --release -p vtracer-cli

      - name: Build vtracer (arm64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cd vtracer && cargo build --release --target aarch64-unknown-linux-gnu -p vtracer-cli

      - name: Build frontend assets
        run: |
          cd templates
          npm ci --no-audit --no-fund
          CI=true npm run build

      - name: Prepare embedded assets (frontend)
        run: |
          mkdir -p internal/assets/web
          rm -rf internal/assets/web/templates internal/assets/web/static
          tar --exclude='templates/node_modules' -cf - templates | tar -xf - -C internal/assets/web
          cp -rf static internal/assets/web/static

      - name: Prepare embedded assets (vtracer)
        run: |
          mkdir -p internal/assets/engine
          cp vtracer/target/release/vtracer internal/assets/engine/vtracer_linux_amd64
          cp vtracer/target/aarch64-unknown-linux-gnu/release/vtracer internal/assets/engine/vtracer_linux_arm64
          chmod +x internal/assets/engine/vtracer_linux_*

      - name: Build Go binary (amd64)
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p bin
          go build -buildvcs=false -ldflags="-s -w -X main.buildVersion=${GITHUB_REF_NAME#v}" -o bin/fan-reubah_linux_amd64 ./cmd/server

      - name: Build Go binary (arm64 cross)
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: arm64
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: '1'
        run: go build -buildvcs=false -ldflags="-s -w -X main.buildVersion=${GITHUB_REF_NAME#v}" -o bin/fan-reubah_linux_arm64 ./cmd/server

      - name: List release assets
        run: ls -lh bin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/fan-reubah_linux_amd64
            bin/fan-reubah_linux_arm64
          generate_release_notes: true